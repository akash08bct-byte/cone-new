<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cone Inspection Training</title>
    <link rel="stylesheet" href="../assets/css/index.css" />
    <link rel="stylesheet" href="../assets/css/training.css" />
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-logo">
          <div class="logo-box">
            <img src="../assets/logo/texa_logo.png" alt="Texa" />
          </div>
        </div>

        <div class="topbar-center">
          <span class="page-title">Thread Inspection</span>
          <div class="waiting-pill">
            <span class="waiting-dot"></span>
            <span>TRAINING</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="storage-indicator" id="storageIndicator">
            <div class="storage-title">Storage</div>
            <span class="storage-pct" id="storagePct">-</span>
            <div class="storage-bar-wrap">
              <div class="storage-bar-fill" id="storageBarFill"></div>
            </div>
          </div>

          <div class="machine_no_design">
            <span class="job-display-label">Machine No:</span>
            <span class="machine_number">Not configured</span>
          </div>
        </div>
      </header>

      <div class="body-wrap">
        <aside class="sidebar">
          <div class="sidebar-section">
            <span class="sidebar-kicker">Navigation</span>
            <button class="sidebar-btn" onclick="openHomePage()"><span class="nav-mark nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path><path d="M9.5 20v-6h5v6"></path></svg></span><span class="nav-title">Home</span></button>
            <button class="sidebar-btn" onclick="openReportPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16"></path><path d="M9 18h10"></path><path d="M9 14h7"></path><path d="M9 10h10"></path><path d="M9 6h4"></path></svg></span><span class="nav-title">Report</span></button>
            <button class="sidebar-btn" onclick="openControllerPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9"></path><path d="M17 7h3"></path><path d="M4 17h3"></path><path d="M11 17h9"></path><path d="M13 5v4"></path><path d="M9 15v4"></path></svg></span><span class="nav-title">Controller</span></button>
            <button class="sidebar-btn active" onclick="openTrainingPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z"></path><path d="M6.5 10.5V15c1.8 2 9.2 2 11 0v-4.5"></path></svg></span><span class="nav-title">Training</span></button>
          </div>
          <div class="sidebar-section system-section">
            <span class="sidebar-kicker">System</span>
            <button class="sidebar-btn" onclick="openSettingPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M4.9 4.9 7 7"></path><path d="m17 17 2.1 2.1"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M4.9 19.1 7 17"></path><path d="m17 7 2.1-2.1"></path></svg></span><span class="nav-title">Settings</span></button>
          </div>
        </aside>

        <main class="main-area training-main">
          <div class="page-header">
            <div>
              <div class="page-kicker">Training</div>
              <h1>Camera Training Capture</h1>
            </div>
          </div>

          <div class="training-layout">
            <section class="training-preview">
              <div class="preview-stage" id="previewStage">
                <img id="cameraFeed" alt="Training camera feed" />
                <div class="preview-empty" id="previewEmpty">No Signal</div>
                <div class="live-badge" id="liveBadge">LIVE</div>
              </div>
            </section>

            <aside class="training-panel">
              <div class="selected-job-box">
                <span>Selected Job</span>
                <strong id="selectedJobText">Not selected</strong>
              </div>

              <div class="training-actions">
                <button id="btnLiveStart" class="action-btn"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"></path></svg></span>Live Start</button>
                <button id="btnLiveStop" class="action-btn secondary" disabled><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7Z"></path></svg></span>Live Stop</button>
                <button id="btnStartTraining" class="action-btn success"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"></path></svg></span>Start Capture</button>
                <button id="btnStopTraining" class="action-btn danger" disabled><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7Z"></path></svg></span>Stop Capture</button>
              </div>

              <div class="stats-grid">
                <div class="stat-box">
                  <span>Session</span>
                  <strong id="sessionCount">0</strong>
                </div>
                <div class="stat-box">
                  <span>Total</span>
                  <strong id="folderCount">0</strong>
                </div>
              </div>

              <div class="gallery-head">
                <strong>Training Images</strong>
              </div>
              <div id="gallery" class="gallery">
                <p>Select a job to view images.</p>
              </div>
              <div class="gallery-actions">
                <button id="btnDeleteImage" class="small-btn danger" disabled>Delete</button>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="jobModal" aria-hidden="true">
      <div class="job-modal" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
        <div class="job-modal-head">
          <strong id="jobModalTitle">Training Job ID</strong>
          <button id="btnJobModalClose" type="button" aria-label="Close">x</button>
        </div>
        <div class="job-modal-body">
          <label class="field-label" for="jobSelect">Choose Old Job ID</label>
          <select id="jobSelect" class="job-select">
            <option value="">Saved jobs</option>
          </select>

          <div class="modal-divider">or</div>

          <label class="field-label" for="jobIdInput">Enter New Job ID</label>
          <input id="jobIdInput" class="job-input" type="text" autocomplete="off" />
        </div>
        <div class="job-modal-foot">
          <button id="btnJobCancel" class="small-btn" type="button">Cancel</button>
          <button id="btnJobSave" class="small-btn success" type="button">Start Capture</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="captureModal" aria-hidden="true">
      <div class="job-modal capture-modal" role="dialog" aria-modal="true" aria-labelledby="captureModalTitle">
        <div class="job-modal-head">
          <strong id="captureModalTitle">Collected Images</strong>
          <button id="btnCaptureModalClose" type="button" aria-label="Close">x</button>
        </div>
        <div class="capture-slider">
          <button id="btnCapturePrev" class="slider-btn" type="button" aria-label="Previous image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
          </button>
          <div id="captureGallery" class="capture-gallery">
            <p>No images found for this job.</p>
          </div>
          <button id="btnCaptureNext" class="slider-btn" type="button" aria-label="Next image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </button>
        </div>
        <div class="job-modal-foot">
          <span id="captureCounter" class="capture-counter">0 / 0</span>
          <button id="btnCaptureDeleteImage" class="small-btn danger" type="button">Delete Image</button>
          <button id="btnCaptureTrainModel" class="small-btn success" type="button">Train Model</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="../assets/js/training.js"></script>
  </body>
</html>
