<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Texa • Controller Status (Patched)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="../assets/css/controller.css">
  <link rel="stylesheet" href="../assets/css/model.css">
  <link rel="stylesheet" href="../assets/css/clock.css" />
  <script src="../assets/js/clock.js" defer></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-logo">
        <div class="logo-box">
          <img src="../assets/logo/texa_logo.jpeg" alt="Texa" />
        </div>
      </div>

      <div class="topbar-center">
        <span class="page-title">Thread Inspection</span>
        <div class="waiting-pill">
          <span class="waiting-dot"></span>
          <span>CONTROLLER</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="storage-indicator" id="storageIndicator">
          <div class="storage-title">Storage</div>
          <span class="storage-pct" id="storagePct">-</span>
          <div class="storage-bar-wrap">
            <div class="storage-bar-fill" id="storageBarFill"></div>
          </div>
        </div>

        <div class="machine_no_design">
          <span class="job-display-label">Machine No:</span>
          <span class="machine_number">Not configured</span>
        </div>

        <div class="dt-block">
          <span id="dateValue" class="date">--/--/----</span>
          <span id="timeValue" class="time">--:--:--</span>
        </div>
      </div>
    </header>

    <div class="body-wrap">
      <aside class="sidebar">
        <div class="sidebar-section">
          <span class="sidebar-kicker">Navigation</span>
          <button class="sidebar-btn" onclick="openHomePage()"><span class="nav-mark nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path><path d="M9.5 20v-6h5v6"></path></svg></span><span class="nav-title">Home</span></button>
          <button class="sidebar-btn" onclick="openReportPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16"></path><path d="M9 18h10"></path><path d="M9 14h7"></path><path d="M9 10h10"></path><path d="M9 6h4"></path></svg></span><span class="nav-title">Report</span></button>
          <button class="sidebar-btn active" onclick="openControllerPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9"></path><path d="M17 7h3"></path><path d="M4 17h3"></path><path d="M11 17h9"></path><path d="M13 5v4"></path><path d="M9 15v4"></path></svg></span><span class="nav-title">Controller</span></button>
          <button class="sidebar-btn" onclick="openTrainingPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z"></path><path d="M6.5 10.5V15c1.8 2 9.2 2 11 0v-4.5"></path></svg></span><span class="nav-title">Training</span></button>
        </div>
        <div class="sidebar-section system-section">
          <span class="sidebar-kicker">System</span>
          <button class="sidebar-btn" onclick="openSettingPage()"><span class="nav-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M4.9 4.9 7 7"></path><path d="m17 17 2.1 2.1"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M4.9 19.1 7 17"></path><path d="m17 7 2.1-2.1"></path></svg></span><span class="nav-title">Settings</span></button>
        </div>
      </aside>

      <main class="main-area">
  <div class="wrap">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="page-kicker">Controller</div>
          <h1>Controller Status</h1>
        </div>
      </div>

      <!-- camera card -->
      <div class="camera-top spinner-card" id="cameraTop">
        <div class="spinner-left">
          <div class="camera-icon">CAM</div>
        </div>
        <div class="spinner-body">
          <div class="camera-title">Camera</div>
          <div class="camera-sub" id="camMsg">Connecting…</div>
        </div>
        <div class="spinner-right">
          <div class="spinner" id="camSpinner" aria-hidden="true"></div>
          <div id="camToggle" class="pill off" role="button" aria-pressed="false"><span id="camOkText">Disconnected</span></div>
        </div>
      </div>

      <div style="display:flex;justify-content:center;margin-top:12px">
        <div class="toolbar" role="toolbar" aria-label="Main controls">
          <button id="btnModbus" class="btn primary">Check Modbus IO</button>
          <button id="btnTrain" class="btn ghost">Training Mode</button>
        </div>
      </div>

      <div class="grid">
        <div>
          <div id="modbusArea" class="modbus-area" style="display:none">
            <div class="panel-title">Modbus Controls</div>
            <div style="display:flex;align-items:center;margin-bottom:12px" class="modebtn">
              <button id="btnCheckAll" class="btn small">Check All Channels</button>
              <button id="btnCheckIndividual" class="btn small">Check Individual Channels</button>
              <div style="flex:1"></div>
            </div>

            <div id="channelPanel" style="display:none">
              <div class="panel-title" style="font-size:14px">Individual Channels</div>
              <div class="two-boards" id="boardsWrap"></div>

              <div style="display:flex;margin-top:10px" class="individual-actions">
                <button id="btnResetIndividual" class="btn small">Reset</button>
                <div id="allCheckNote" class="note" style="align-self:center;margin-left:8px"></div>
              </div>

              <div id="individualNote" class="note" style="margin-top:10px">
                Click <strong>ON</strong> or <strong>OFF</strong> for each channel to set request.
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>
      </main>
    </div>
  </div>

  <div id="myModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <span class="close" id="modalClose" title="Close">&times;</span>
      <div id="model-datas"></div>
      <div class="modal-actions">
        <div id="modalNote" class="note" style="display: flex;align-items: center;"></div>
          <button id="btnModalRefresh" class="btn small">Refresh</button>
          <button id="btnModalClose2" class="btn small">Close</button>
        </div>
    </div>
  </div>
<div class="toast" id="toast"></div>
  <script src="../assets/js/controller.js"></script>
</body>

</html>
